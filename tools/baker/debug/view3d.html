<title>Pallet Town 2.5D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: the baked map fills the screen; a collapsible tuning panel floats top-left, a d-pad bottom-right. */
  :root {
    --sky: #9fd3e8;
    --panel: #fbfaf5;
    --panel-edge: #d9d4c3;
    --ink: #22261f;
    --muted: #667060;
    --accent: #d6342c;        /* the player marker's red */
    --accent-ink: #ffffff;
    --pad: #ffffffcc;
    --gba-bg: #10120e;   /* letterbox around the GBA screen */
    --font-display: "Pixelify Sans", "Courier New", monospace;
    --font-ui: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #1d2a33; --panel: #20231d; --panel-edge: #3a4034; --ink: #ecefe4; --muted: #a2ab96;
      --accent: #f0645a; --accent-ink: #1a0d0c; --pad: #2a2e26cc; --gba-bg: #0b0c0a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #1d2a33; --panel: #20231d; --panel-edge: #3a4034; --ink: #ecefe4; --muted: #a2ab96;
    --accent: #f0645a; --accent-ink: #1a0d0c; --pad: #2a2e26cc; --gba-bg: #0b0c0a; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--sky); color: var(--ink); font: 14px/1.4 var(--font-ui); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  #panel {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    width: min(300px, calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
    box-shadow: 0 6px 24px #0000002a;
  }
  #panel summary {
    list-style: none; cursor: pointer; padding: 10px 14px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  }
  #panel summary::-webkit-details-marker { display: none; }
  #panel summary:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h1 { margin: 0; font: 700 18px/1.1 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
  .hint { color: var(--muted); font-size: 12px; }
  #panel[open] summary .hint::after { content: "hide"; }
  #panel:not([open]) summary .hint::after { content: "show"; }
  .body { padding: 0 14px 14px; display: grid; gap: 12px; }
  .readout { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .readout dt { color: var(--muted); }
  .readout dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
  legend { padding: 0; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .slider { display: grid; grid-template-columns: 3.2em 1fr 2.4em; align-items: center; gap: 8px; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: center; }
  input[type=checkbox] { accent-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.action {
    font: 700 13px var(--font-ui); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--panel-edge); }
  #copied { font-size: 12px; color: var(--muted); }
  #yaml { width: 100%; font: 12px ui-monospace, monospace; color: var(--ink); background: transparent; border: 1px dashed var(--panel-edge); border-radius: 6px; padding: 6px; }
  .foot { font-size: 12px; color: var(--muted); }

  #dpad {
    position: fixed;
    right: calc(16px + env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px;
    user-select: none; -webkit-user-select: none;
  }
  #dpad button {
    border: 1px solid var(--panel-edge); border-radius: 10px; background: var(--pad); color: var(--ink);
    font: 700 18px var(--font-display); cursor: pointer; touch-action: none;
  }
  #dpad button.held { background: var(--accent); color: var(--accent-ink); }
  #dpad [data-dir=up] { grid-area: 1 / 2; } #dpad [data-dir=left] { grid-area: 2 / 1; }
  #dpad [data-dir=right] { grid-area: 2 / 3; } #dpad [data-dir=down] { grid-area: 3 / 2; }
  /* Compare mode: GBA screen left (or top when the window is portrait), 2.5D right (or bottom). */
  #gba {
    position: fixed; left: 0; top: 0; width: 50%; height: 100%;
    background: var(--gba-bg); object-fit: contain; image-rendering: pixelated;
  }
  body.compare { background: var(--gba-bg); }
  @media (max-aspect-ratio: 1/1) {
    #gba { width: 100%; height: 50%; }
  }
  .pane-label {
    position: fixed; display: none; padding: 4px 9px; border-radius: 999px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--panel-edge);
    font: 700 12px var(--font-display); letter-spacing: .03em; pointer-events: none;
  }
  body.compare .pane-label { display: block; }
  #labelGba { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #label3d { left: calc(50% + 12px); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  @media (max-aspect-ratio: 1/1) {
    #labelGba { bottom: auto; top: calc(50% - 36px); }
    #label3d { left: calc(12px + env(safe-area-inset-left, 0px)); }
  }
  #topRight {
    position: fixed; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  }
  #compareBtn {
    font: 700 13px var(--font-ui); border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 16px #00000030;
  }
  #musicBtn {
    font: 700 12px var(--font-ui); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    background: var(--panel); color: var(--ink);
  }
  #musicBtn[aria-pressed="false"] { color: var(--muted); }
  #compareBtn[aria-pressed="true"] { background: var(--panel); color: var(--ink); border: 1px solid var(--panel-edge); }
  /* The FireRed text box: a white two-line box; signs get a wooden frame. Its
     colours are the game's own, the same in light and dark themes. */
  #textbox {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(720px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 12px 22px 14px; background: #f8f8f8; border-radius: 10px;
    border: 5px double #5d8ea6; box-shadow: 0 6px 24px #0005;
    font: 500 clamp(17px, 3.2vw, 25px)/1.55 var(--font-display); letter-spacing: .02em;
  }
  #textbox[data-style="sign"] { border-color: #9a6b3c; background: #fbf6ea; }
  #textbox p { margin: 0; min-height: 1.55em; white-space: pre; overflow: hidden; }
  #textbox[data-color="neutral"] p { color: #404040; text-shadow: 2px 2px 0 #d0d0c8; }
  #textbox[data-color="male"] p { color: #2f58c8; text-shadow: 2px 2px 0 #a8c0f0; }
  #textbox[data-color="female"] p { color: #d83838; text-shadow: 2px 2px 0 #f8b8b0; }
  #tbMore { position: absolute; right: 16px; bottom: 8px; color: #d83838; font-size: 16px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #tbMore { animation: none; } }
  #yesno {
    position: fixed; z-index: 3; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(140px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 4px; padding: 10px 18px; background: #f8f8f8; border: 5px double #5d8ea6; border-radius: 10px;
    font: 500 22px var(--font-display); color: #404040;
  }
  #yesno span::before { content: "▶ "; visibility: hidden; color: #404040; }
  #yesno span.on::before { visibility: visible; }
  #emote {
    position: fixed; z-index: 2; transform: translate(-50%, -100%); padding: 2px 9px;
    background: #ffffff; color: #202020; border: 2px solid #202020; border-radius: 10px;
    font: 700 22px var(--font-display); pointer-events: none;
  }
  #aBtn {
    position: fixed; z-index: 2; width: 64px; height: 64px; border-radius: 50%;
    right: calc(16px + 164px + 18px + env(safe-area-inset-right, 0px)); bottom: calc(16px + 58px + env(safe-area-inset-bottom, 0px));
    border: 1px solid var(--panel-edge); background: var(--accent); color: var(--accent-ink);
    font: 700 22px var(--font-display); cursor: pointer; touch-action: none;
  }
  #aBtn.held { filter: brightness(.85); }
  /* Unless the window is wide, the text box sits above the d-pad and A button. */
  @media (max-width: 1180px) {
    #textbox { bottom: calc(196px + env(safe-area-inset-bottom, 0px)); }
    #yesno { bottom: calc(330px + env(safe-area-inset-bottom, 0px)); }
  }
  /* Black fade when going through a door or up the stairs. */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 1; }
  #fade.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #fade { transition: none; } }
  #error { position: fixed; inset: auto 16px 16px; padding: 12px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--accent); }
</style>

<canvas id="stage" tabindex="0" aria-label="The map rendered in 2.5D. Use WASD or the arrow keys to walk."></canvas>
<canvas id="gba" hidden aria-label="The same spot as it looks in FireRed on the Game Boy Advance."></canvas>
<span class="pane-label" id="labelGba">FireRed · GBA 240×160</span>
<span class="pane-label" id="label3d">pokeRED3D · 2.5D</span>
<div id="topRight">
  <button type="button" id="compareBtn" aria-pressed="false">Compare with FireRed</button>
  <button type="button" id="musicBtn" aria-pressed="true">Music on</button>
</div>

<details id="panel" open>
  <summary><h1 id="title">Pallet Town</h1><span class="hint"></span></summary>
  <div class="body">
    <dl class="readout">
      <dt>cell</dt><dd id="rCell">–</dd>
      <dt>class</dt><dd id="rClass">–</dd>
      <dt>behavior</dt><dd id="rBehavior">–</dd>
      <dt>height</dt><dd id="rHeight">–</dd>
    </dl>
    <fieldset>
      <legend id="legendCam">Camera</legend>
      <label class="slider" for="pitch">pitch <input type="range" id="pitch" min="25" max="90"> <output id="pitchOut"></output></label>
      <label class="slider" for="fov">fov <input type="range" id="fov" min="10" max="60"> <output id="fovOut"></output></label>
      <label class="slider" for="view">view <input type="range" id="view" min="6" max="30"> <output id="viewOut"></output></label>
      <div class="row">
        <button class="action" id="copy" type="button">Copy for camera.yaml</button>
        <button class="action ghost" id="reset" type="button">Reset</button>
        <span id="copied" role="status"></span>
      </div>
      <input id="yaml" readonly hidden aria-label="Camera settings as YAML">
    </fieldset>
    <fieldset>
      <legend>View</legend>
      <label class="check" for="shade"><input type="checkbox" id="shade" checked> Lighting</label>
      <label class="check" for="orbit"><input type="checkbox" id="orbit"> Free orbit camera (drag to rotate)</label>
    </fieldset>
    <p class="foot" id="foot"></p>
  </div>
</details>

<div id="fade" aria-hidden="true"></div>

<div id="textbox" hidden data-style="normal" data-color="neutral" role="status" aria-live="polite"><p id="tb1"></p><p id="tb2"></p><span id="tbMore" hidden aria-hidden="true">▼</span></div>
<div id="yesno" hidden><span id="yes">YES</span><span id="no">NO</span></div>
<div id="emote" hidden aria-hidden="true"></div>
<button type="button" id="aBtn" aria-label="A: talk, read, continue">A</button>

<div id="dpad" aria-label="Walk">
  <button type="button" data-dir="up" aria-label="Walk north">▲</button>
  <button type="button" data-dir="left" aria-label="Walk west">◀</button>
  <button type="button" data-dir="right" aria-label="Walk east">▶</button>
  <button type="button" data-dir="down" aria-label="Walk south">▼</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
/*DATA*/

const $ = (id) => document.getElementById(id);
const pretty = (name) => name.replace(/_/g, ' ').replace(/([a-z])([A-Z0-9])/g, '$1 $2');

const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9fd3e8');
scene.add(new THREE.HemisphereLight('#ffffff', '#8a9a7a', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 1.6);
sun.position.set(-6, 14, 8);
scene.add(sun);

// ---- maps: each has its own atlas and sits at its offset in world tiles ----
const loader = new THREE.TextureLoader();
const maps = await Promise.all(WORLD.map(async (w) => {
  const tex = await loader.loadAsync(w.atlas);
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.flipY = false;
  tex.colorSpace = THREE.SRGBColorSpace;
  const D = w.data;
  return {
    D, G: D.grid, W: D.width, H: D.height, ox: w.ox, oy: w.oy, area: w.area, tex,
    img: tex.image, AW: tex.image.width, AH: tex.image.height,
    mats: {
      lit: [new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }), new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide, alphaTest: 0.5 })],
      flat: [new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, alphaTest: 0.5 })],
    },
    spriteMat: new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide }),
  };
}));

function build(m, filter) {
  const pos = [], uv = [];
  for (const q of m.D.quads) {
    if (!filter(q)) continue;
    const p = q.p, [u0, v0, u1, v1] = q.uv;
    const corners = [[0, u0, v1], [1, u1, v1], [2, u1, v0], [3, u0, v0]];
    for (const i of [0, 1, 2, 0, 2, 3]) {
      const [c, u, v] = corners[i];
      pos.push(p[c * 3] + m.ox, p[c * 3 + 1], p[c * 3 + 2] + m.oy);
      uv.push(u / m.AW, v / m.AH);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
for (const m of maps) {
  m.opaque = new THREE.Mesh(build(m, (q) => !q.a), m.mats.lit[0]);
  m.cutout = new THREE.Mesh(build(m, (q) => q.a), m.mats.lit[1]);
  scene.add(m.opaque, m.cutout);
}

// ---- areas: connected outdoor maps share one; each interior is its own ----
let area = 0;
const inArea = (m) => m.area === area;
const areaMaps = () => maps.filter(inArea);
const mapByName = (name) => maps.find((m) => m.D.name === name);

// ---- the world grid: the current area's cells in shared world coordinates ----
function locate(gx, gy) {
  for (const m of areaMaps()) {
    const x = gx - m.ox, y = gy - m.oy;
    if (x >= 0 && y >= 0 && x < m.W && y < m.H) return { m, i: y * m.W + x, x, y };
  }
  return null;
}
const walkable = (gx, gy) => !!locate(gx, gy)?.m.G.walkable[locate(gx, gy).i];
const heightAt = (gx, gy) => { const c = locate(gx, gy); return c ? c.m.G.height[c.i] : 0; };
const behaviorAt = (gx, gy) => { const c = locate(gx, gy); return c ? c.m.G.behavior[c.i] : null; };

const totals = maps.reduce((t, m) => ({ quads: t.quads + m.D.quads.length, npcs: t.npcs + m.D.objects.filter((o) => !o.hidden).length }), { quads: 0, npcs: 0 });
$('foot').textContent = `${maps.map((m) => pretty(m.D.name)).join(', ')} · ${totals.quads} quads · ${totals.npcs} people. Click the map, then walk with WASD or the arrow keys.`;

// ---- characters: camera-facing sprite billboards ----
const BB = maps[0].D.billboards;
const steps = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const jumpBehavior = { up: 'MB_JUMP_NORTH', down: 'MB_JUMP_SOUTH', left: 'MB_JUMP_WEST', right: 'MB_JUMP_EAST' };
// FireRed frame order: 0 face S, 1 N, 2 W, 3-4 walk S, 5-6 walk N, 7-8 walk W; east mirrors west.
const standFrame = { down: 0, up: 1, left: 2, right: 2 };
const walkFrames = { down: [3, 4], up: [5, 6], left: [7, 8], right: [7, 8] };
const JUMP_HEIGHT = 0.6; // tiles at the top of a ledge hop
const shadowMat = new THREE.MeshBasicMaterial({ color: '#000000', transparent: true, opacity: 0.28, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });

function makeActor({ gfx, x, y, facing = 'down', movement = '', range = [0, 0], id = null, script = null, flag = null, hidden = false }, m) {
  const s = m.D.sprites[gfx];
  const a = { gfx, s, m, area: m.area, id, script, flag, removed: hidden, startFacing: facing, x, y, home: { x, y }, range, movement, facing, from: null, t: 1, jump: false, parity: 0, turnHold: 0, wait: 1 + Math.random() * 3 };
  a.root = new THREE.Group();
  a.tilt = new THREE.Group();
  a.root.add(a.tilt);
  if (s) {
    const geo = new THREE.PlaneGeometry(1, 1);
    geo.translate(0, 0.5, 0); // pivot at the feet
    a.sprite = new THREE.Mesh(geo, m.spriteMat);
    a.tilt.add(a.sprite);
    const sh = new THREE.Mesh(new THREE.CircleGeometry(s.shadow, 20), shadowMat);
    sh.rotation.x = -Math.PI / 2;
    sh.scale.y = 0.55;
    sh.position.y = 0.02;
    a.root.add(sh);
  } else {
    // No sprite in the decomp for this one: a plain marker keeps it visible.
    const mk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 1, 12), new THREE.MeshLambertMaterial({ color: '#6d7a8c' }));
    mk.position.y = 0.5;
    a.tilt.add(mk);
  }
  scene.add(a.root);
  return a;
}

function setFrame(a, frame, mirror) {
  const [u0, v0, u1, v1] = a.s.frames[frame] ?? a.s.frames[0];
  const uv = a.sprite.geometry.attributes.uv;
  const [l, r] = mirror ? [u1, u0] : [u0, u1];
  const { AW, AH } = a.m;
  // PlaneGeometry vertex order: top-left, top-right, bottom-left, bottom-right.
  uv.setXY(0, l / AW, v0 / AH); uv.setXY(1, r / AW, v0 / AH);
  uv.setXY(2, l / AW, v1 / AH); uv.setXY(3, r / AW, v1 / AH);
  uv.needsUpdate = true;
}

// Start where a new game does (Red's bedroom) when that map is in the bake.
const home = (START && mapByName(START.map)) || maps[0];
const start = START && home.D.name === START.map ? { x: START.x + home.ox, y: START.y + home.oy }
  : home.D.warps[0] ? { x: home.D.warps[0].x + home.ox, y: home.D.warps[0].y + 1 + home.oy } : { x: home.ox + (home.W >> 1), y: home.oy + (home.H >> 1) };
area = home.area;
const player = makeActor({ gfx: BB.player, x: start.x, y: start.y, facing: START?.facing ?? 'down' }, home);
const npcs = maps.flatMap((m) => m.D.objects.map((o) => makeActor({ ...o, x: o.x + m.ox, y: o.y + m.oy }, m)));
const actors = [player, ...npcs];
const areaActors = () => actors.filter((a) => a === player || a.area === area);

const occupied = (x, y, self) => areaActors().some((a) => a !== self && !a.removed && ((a.x === x && a.y === y) || (a.from && a.from.x === x && a.from.y === y)));
const canEnter = (x, y, self) => walkable(x, y) && !occupied(x, y, self);
// ---- warps ----
// Like FireRed: walking into a door, pressing the arrow's direction on an exit
// mat, or stepping onto stairs warps; other cells listed as warps are inert.
const arrowDir = { MB_NORTH_ARROW_WARP: 'up', MB_SOUTH_ARROW_WARP: 'down', MB_WEST_ARROW_WARP: 'left', MB_EAST_ARROW_WARP: 'right' };
const isDoor = (b) => b === 'MB_WARP_DOOR' || b === 'MB_CAVE_DOOR';
const isStairs = (b) => /STAIR_WARP|LADDER|REGULAR_WARP|ESCALATOR/.test(b ?? '');
function warpAt(gx, gy) {
  const c = locate(gx, gy);
  return c && c.m.D.warps.find((w) => w.x === c.x && w.y === c.y && w.to && mapByName(w.to));
}
let warping = false;
function warp(w) {
  const dest = mapByName(w.to), target = dest.D.warps[w.toWarp];
  if (target) warpTo(dest, target.x, target.y, target.behavior);
}
/** Fade out, move the player to (x, y) on dest, run its map scripts, fade in. */
function warpTo(dest, x, y, arriveBehavior = null) {
  warping = true;
  held.clear();
  $('fade').classList.add('on');
  return new Promise((done) => setTimeout(() => {
    area = dest.area;
    Object.assign(player, { x: x + dest.ox, y: y + dest.oy, from: null, t: 1, jump: false, invisible: false });
    player.root.visible = true; // a scene may have hidden the player walking through a door
    enterMap(dest, true);
    applyAreaLook();
    // Out through a door: step off it. Down stairs or up: step off the stairs.
    // Onto an exit mat: face back into the room.
    if (isDoor(arriveBehavior) || isStairs(arriveBehavior)) pendingStep = isDoor(arriveBehavior) ? 'down' : ['down', 'left', 'right', 'up'];
    else if (arrowDir[arriveBehavior]) player.facing = opposite[arrowDir[arriveBehavior]];
    lastCell = '';
    $('fade').classList.remove('on');
    setTimeout(() => { warping = false; done(); }, 200);
  }, 220));
}
let pendingStep = null;

function startStep(a, dir) {
  const [dx, dy] = steps[dir];
  a.facing = dir;
  if (a === player) {
    // Into a door, or off an exit mat in its arrow's direction.
    const ahead = warpAt(a.x + dx, a.y + dy), here = warpAt(a.x, a.y);
    if (ahead && isDoor(ahead.behavior)) { warp(ahead); return true; }
    if (here && arrowDir[here.behavior] === dir) { warp(here); return true; }
  }
  let to = null;
  // A ledge facing this way: hop over it to the cell beyond.
  if (behaviorAt(a.x + dx, a.y + dy) === jumpBehavior[dir] && canEnter(a.x + 2 * dx, a.y + 2 * dy, a)) to = { x: a.x + 2 * dx, y: a.y + 2 * dy, jump: true };
  else if (canEnter(a.x + dx, a.y + dy, a)) to = { x: a.x + dx, y: a.y + dy, jump: false };
  if (!to) return false;
  a.from = { x: a.x, y: a.y };
  a.x = to.x; a.y = to.y; a.t = 0; a.jump = to.jump;
  a.parity ^= 1; // alternate feet each step
  return true;
}

// Size so a sprite covers the same screen area as in FireRed, relative to ground tiles.
function spriteScale(a, pitchDeg) {
  const rows = a.s.height / 16, cols = a.s.width / 16;
  const p = (pitchDeg * Math.PI) / 180, lean = (BB.lean * Math.PI) / 180;
  const len = BB.matchScreenSize ? (rows * Math.sin(p)) / Math.cos(p - lean) : rows;
  return [cols, len];
}

/** Where an actor is between cells (world tiles, cell top-left), its ground height and hop height. */
function actorPos(a) {
  const k = a.from ? Math.min(a.t, 1) : 1;
  const fx = a.from ? a.from.x : a.x, fy = a.from ? a.from.y : a.y;
  const h0 = heightAt(fx, fy), h1 = heightAt(a.x, a.y);
  const lift = a.from && a.jump ? 4 * k * (1 - k) * JUMP_HEIGHT : 0;
  return { x: fx + (a.x - fx) * k, y: fy + (a.y - fy) * k, h: h0 + (h1 - h0) * k, lift };
}
const actorFrame = (a) => (a.from && (a.jump || a.t < 0.5) ? walkFrames[a.facing][a.parity] : standFrame[a.facing]);

function placeActor(a, camPos, pitchDeg) {
  const p = actorPos(a);
  const x = p.x + 0.5, z = p.y + 0.5;
  const yaw = Math.atan2(camPos.x - x, camPos.z - z);
  const off = BB.feetOffset ?? 0;
  a.root.position.set(x + Math.sin(yaw) * off, p.h, z + Math.cos(yaw) * off);
  a.root.rotation.y = yaw;
  a.tilt.position.y = p.lift; // the shadow stays on the ground
  if (!a.sprite) return;
  a.tilt.rotation.x = (-BB.lean * Math.PI) / 180;
  const [sx, sy] = spriteScale(a, pitchDeg);
  a.sprite.scale.set(sx, sy, 1);
  setFrame(a, actorFrame(a), a.facing === 'right');
}

// ---- the original FireRed view: a 240x160 GBA screen drawn from the same state ----
const gba = $('gba'), gctx = gba.getContext('2d');
gba.width = 240; gba.height = 160;
function drawGba() {
  gctx.imageSmoothingEnabled = false;
  gctx.fillStyle = '#000';
  gctx.fillRect(0, 0, 240, 160);
  const pp = actorPos(player);
  // FireRed keeps the player's cell at column 7, row 4 of the 15x10 screen.
  const ox = Math.round(pp.x * 16) - 112, oy = Math.round(pp.y * 16) - 64;
  // Where no map is loaded, the GBA repeats the current map's border blocks.
  const here = locate(player.x, player.y)?.m ?? home, B = here.D.original.border;
  const bw = (B[2] - B[0]) / 16, bh = (B[3] - B[1]) / 16;
  for (let ty = Math.floor(oy / 16); ty * 16 < oy + 160; ty++)
    for (let tx = Math.floor(ox / 16); tx * 16 < ox + 240; tx++) {
      if (locate(tx, ty)) continue;
      const bx = (((tx - here.ox) % bw) + bw) % bw, by = (((ty - here.oy) % bh) + bh) % bh;
      gctx.drawImage(here.img, B[0] + bx * 16, B[1] + by * 16, 16, 16, tx * 16 - ox, ty * 16 - oy, 16, 16);
    }
  const layer = (key) => {
    for (const m of areaMaps()) {
      const [u0, v0] = m.D.original[key];
      gctx.drawImage(m.img, u0, v0, m.W * 16, m.H * 16, m.ox * 16 - ox, m.oy * 16 - oy, m.W * 16, m.H * 16);
    }
  };
  layer('below');
  // Sprites, back to front; feet on the bottom of their cell.
  for (const a of areaActors().sort((p, q) => actorPos(p).y - actorPos(q).y)) {
    if (!a.s) continue;
    const p = actorPos(a);
    const [u0, v0] = a.s.frames[actorFrame(a)];
    const dx = Math.round(p.x * 16) - ox + (16 - a.s.width) / 2;
    const dy = Math.round((p.y - p.lift) * 16) - oy + 16 - a.s.height;
    gctx.save();
    if (a.facing === 'right') { gctx.translate(dx + a.s.width, dy); gctx.scale(-1, 1); } else gctx.translate(dx, dy);
    gctx.drawImage(a.m.img, u0, v0, a.s.width, a.s.height, 0, 0, a.s.width, a.s.height);
    gctx.restore();
  }
  layer('above');
}

let lastCell = '';
function readout() {
  const c = locate(player.x, player.y);
  const key = `${player.x},${player.y},${player.facing}`;
  if (!c || key === lastCell) return;
  lastCell = key;
  $('title').textContent = pretty(c.m.D.name);
  if (c.m !== currentMap) enterMap(c.m, false); // walked across a map edge (or the first frame)
  $('rCell').textContent = `${c.x}, ${c.y}  (elevation ${c.m.G.elevation[c.i]}, facing ${player.facing})`;
  $('rClass').textContent = c.m.G.class[c.i];
  $('rBehavior').textContent = c.m.G.behavior[c.i];
  $('rHeight').textContent = c.m.G.height[c.i];
}

// NPC movement types: FACE_* stand still, WANDER_* roam inside their range, LOOK_AROUND turns.
function updateNpc(a, dt) {
  if (a.from) return;
  a.wait -= dt;
  if (a.wait > 0) return;
  a.wait = 1 + Math.random() * 3;
  const mv = a.movement;
  let dirs = null;
  if (mv === 'MOVEMENT_TYPE_WANDER_AROUND') dirs = ['up', 'down', 'left', 'right'];
  else if (mv === 'MOVEMENT_TYPE_WANDER_UP_AND_DOWN') dirs = ['up', 'down'];
  else if (mv === 'MOVEMENT_TYPE_WANDER_LEFT_AND_RIGHT') dirs = ['left', 'right'];
  if (mv === 'MOVEMENT_TYPE_LOOK_AROUND') { a.facing = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)]; return; }
  if (!dirs) return;
  const dir = dirs[Math.floor(Math.random() * dirs.length)];
  const [dx, dy] = steps[dir];
  const nx = a.x + dx - a.home.x, ny = a.y + dy - a.home.y;
  if (Math.abs(nx) > a.range[0] || Math.abs(ny) > a.range[1] || behaviorAt(a.x + dx, a.y + dy)?.startsWith('MB_JUMP')) { a.facing = dir; return; }
  startStep(a, dir);
}

// ---- music: a small version of FireRed's sound engine (m4a) ----
// Notes arrive already resolved to voices by the baker; this plays them with
// the engine's envelopes, loops each song between its [ ] markers, and fades
// between songs when the map's music changes.
const FRAME = 1 / 59.73; // m4a steps envelopes once per video frame
const music = {
  ctx: null, out: null, player: null, current: null, wanted: null, muted: false,
  start() {
    if (this.ctx || !MUSIC) return;
    const ctx = (this.ctx = new AudioContext());
    const comp = ctx.createDynamicsCompressor();
    comp.connect(ctx.destination);
    this.out = ctx.createGain();
    this.out.gain.value = this.muted ? 0 : 0.6;
    this.out.connect(comp);
    // A short feedback echo stands in for m4a's reverb on sample voices.
    this.reverbIn = ctx.createGain();
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.09;
    const fb = ctx.createGain(); fb.gain.value = 0.35;
    this.reverbIn.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(this.out);
    // Sample voices: signed 8-bit PCM at each sample's own rate.
    this.buffers = {};
    for (const [name, s] of Object.entries(MUSIC.samples)) {
      const raw = Uint8Array.from(atob(s.data), (c) => c.charCodeAt(0));
      const buf = ctx.createBuffer(1, raw.length, Math.max(3000, s.rate));
      const ch = buf.getChannelData(0);
      for (let i = 0; i < raw.length; i++) ch[i] = ((raw[i] << 24) >> 24) / 128;
      this.buffers[name] = buf;
    }
    // Square waves at the GB's four duty cycles, and the wave channel's shapes.
    const pulse = (duty) => {
      const n = 64, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) im[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
      return ctx.createPeriodicWave(re, im);
    };
    this.squares = [0.125, 0.25, 0.5, 0.75].map(pulse);
    this.waves = {};
    for (const [name, w] of Object.entries(MUSIC.waves)) {
      const n = w.length, re = new Float32Array(n / 2), im = new Float32Array(n / 2);
      for (let k = 1; k < n / 2; k++) for (let i = 0; i < n; i++) {
        re[k] += (w[i] * Math.cos((2 * Math.PI * k * i) / n)) / n;
        im[k] += (w[i] * Math.sin((2 * Math.PI * k * i) / n)) / n;
      }
      this.waves[name] = ctx.createPeriodicWave(re, im);
    }
    const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    noise.getChannelData(0).forEach((_, i, a) => { a[i] = Math.random() * 2 - 1; });
    this.noise = noise;
    this.timer = setInterval(() => this.player?.schedule(), 40);
    if (this.wanted) this.play(this.wanted);
  },
  play(name) {
    this.wanted = name;
    if (!this.ctx || name === this.current) return;
    const old = this.player;
    if (old) old.stop(0.35);
    this.current = name;
    this.player = MUSIC.songs[name] ? new SongPlayer(this, MUSIC.songs[name], old ? 0.4 : 0.05) : null;
  },
  setMuted(on) {
    this.muted = on;
    if (this.out) this.out.gain.setTargetAtTime(on ? 0 : 0.6, this.ctx.currentTime, 0.05);
  },
};

class SongPlayer {
  constructor(m, song, delay) {
    this.m = m; this.song = song;
    const ctx = m.ctx;
    this.gain = ctx.createGain();
    this.gain.connect(m.out);
    this.t0 = ctx.currentTime + delay; // context time of song time 0
    // All events of all tracks in time order.
    this.events = [];
    song.tracks.forEach((t, ti) => {
      for (const n of t.notes) this.events.push([n[0], ti, 'note', n]);
      for (const c of t.controls) this.events.push([c[0], ti, c[1], c[2]]);
    });
    this.events.sort((a, b) => a[0] - b[0] || (a[2] === 'note') - (b[2] === 'note'));
    this.loopFrom = song.loop ? this.events.findIndex((e) => e[0] >= song.loop.start) : -1;
    this.end = song.loop ? song.loop.end : song.length;
    this.i = 0;
    this.tracks = song.tracks.map(() => {
      const gain = ctx.createGain();
      gain.gain.value = (100 / 127) * (song.volume / 127);
      gain.connect(this.gain);
      const bend = ctx.createConstantSource(); bend.offset.value = 0; bend.start();
      const lfo = ctx.createOscillator(); lfo.frequency.value = (22 * 59.73) / 256; lfo.start();
      const depth = ctx.createGain(); depth.gain.value = 0; lfo.connect(depth);
      return { gain, bend, lfo, depth, pan: 0, range: 2 };
    });
  }
  schedule() {
    const ctx = this.m.ctx;
    if (this.stopped) return;
    // Look further ahead when the tab is in the background and timers slow down.
    const horizon = ctx.currentTime + (document.hidden ? 1.5 : 0.25);
    while (this.t0 + (this.events[this.i]?.[0] ?? this.end) < horizon) {
      const e = this.events[this.i];
      if (!e || e[0] >= this.end) {
        if (this.loopFrom < 0) { this.stopped = true; return; }
        this.t0 += this.end - this.song.loop.start;
        this.i = this.loopFrom;
        continue;
      }
      this.i++;
      const when = Math.max(ctx.currentTime, this.t0 + e[0]), tr = this.tracks[e[1]];
      // Notes that are already late (timers stalled in a background tab) are
      // skipped rather than all played at once; controls still apply.
      if (e[2] === 'note') { if (this.t0 + e[0] > ctx.currentTime - 0.1) this.note(tr, e[3], when); }
      else if (e[2] === 'cc7') tr.gain.gain.setValueAtTime((e[3] / 127) * (this.song.volume / 127), when);
      else if (e[2] === 'cc10') tr.pan = (e[3] - 64) / 64;
      else if (e[2] === 'cc20') tr.range = e[3];
      else if (e[2] === 'cc1') tr.depth.gain.setValueAtTime(e[3] * 1.5, when);
      else if (e[2] === 'cc21') tr.lfo.frequency.setValueAtTime((e[3] * 59.73) / 256, when);
      else if (e[2] === 'bend') tr.bend.offset.setValueAtTime((e[3] / 8192) * tr.range * 100, when);
    }
  }
  note(tr, [t0, t1, key, vel, vi], when) {
    const m = this.m, ctx = m.ctx, v = this.song.voices[vi];
    const off = when + Math.max(0.02, t1 - t0);
    let src;
    if (v.type === 'sample') {
      const s = MUSIC.samples[v.sample];
      src = ctx.createBufferSource();
      src.buffer = m.buffers[v.sample];
      if (s.loopStart >= 0) { src.loop = true; src.loopStart = s.loopStart / s.rate; src.loopEnd = s.loopEnd / s.rate; }
      src.playbackRate.value = v.fixed ? 1 : 2 ** ((key - 60) / 12);
    } else if (v.type === 'noise') {
      src = ctx.createBufferSource();
      src.buffer = m.noise; src.loop = true;
      src.playbackRate.value = Math.min(4, 2 ** ((key - 60) / 12) * 0.5);
    } else {
      src = ctx.createOscillator();
      src.setPeriodicWave(v.type === 'square' ? m.squares[v.duty] : m.waves[v.wave]);
      src.frequency.value = 440 * 2 ** ((key - 69) / 12);
    }
    tr.bend.connect(src.detune);
    tr.depth.connect(src.detune);
    // Envelope, per m4a: sample voices count 0-255 per frame, GB channels 0-15.
    const e = v.env, env = ctx.createGain(), g = env.gain;
    let peak = vel / 127, attack, sustain, decayTau, releaseTau;
    if (e.cgb) {
      peak *= 0.55;
      attack = e.a * FRAME * 8; sustain = (e.s / 15) * peak;
      decayTau = e.d ? e.d * FRAME * 4 : 0.001; releaseTau = e.r ? e.r * FRAME * 4 : 0.004;
    } else {
      attack = e.a >= 255 ? 0 : (255 / Math.max(1, e.a)) * FRAME; sustain = (e.s / 255) * peak;
      decayTau = e.d ? -FRAME / Math.log(e.d / 256) : 0.001; releaseTau = e.r ? -FRAME / Math.log(e.r / 256) : 0.004;
    }
    g.setValueAtTime(0, when);
    g.linearRampToValueAtTime(peak, when + attack + 0.002);
    g.setTargetAtTime(sustain, when + attack + 0.002, decayTau);
    g.setTargetAtTime(0, off, releaseTau);
    const pan = ctx.createStereoPanner();
    pan.pan.value = Math.max(-1, Math.min(1, tr.pan + v.pan));
    src.connect(env); env.connect(pan); pan.connect(tr.gain);
    if (v.type === 'sample' && this.song.reverb) {
      const send = ctx.createGain(); send.gain.value = this.song.reverb / 127 * 0.5;
      pan.connect(send); send.connect(m.reverbIn);
    }
    src.start(when);
    src.stop(off + releaseTau * 6 + 0.05);
    src.onended = () => { tr.bend.disconnect(src.detune); tr.depth.disconnect(src.detune); pan.disconnect(); };
  }
  stop(fade) {
    const now = this.m.ctx.currentTime;
    this.stopped = true;
    this.gain.gain.setTargetAtTime(0, now, fade / 4);
    setTimeout(() => { this.gain.disconnect(); for (const t of this.tracks) { t.bend.stop(); t.lfo.stop(); } }, fade * 1000 + 200);
  }
}
// Browsers only allow sound after the viewer interacts, so start on the first key or tap.
for (const ev of ['keydown', 'pointerdown']) addEventListener(ev, () => music.start(), { once: true });
$('musicBtn').onclick = () => {
  music.start();
  music.setMuted(!music.muted);
  $('musicBtn').textContent = music.muted ? 'Music off' : 'Music on';

// ---- talking and signs: a FireRed text box and a small event-script player ----
// Scripts are the decomp's own (baked into SCRIPTS). The common commands run;
// ones the preview can't do yet (battles, items, fanfares) are skipped.
const NAMES = { PLAYER: 'RED', RIVAL: 'BLUE' };
const TEXT_COLORS = ['male', 'female', 'neutral', 'neutral']; // NPC_TEXT_COLOR_MALE/FEMALE/MON/NEUTRAL
const story = {
  flags: new Set(SCRIPTS.startFlags),
  vars: {},
};
let scriptDepth = 0, scriptRunning = false, lastCommand = '';
const frameWaiters = [];
/** Resolves once cond() is true, checked every game frame. */
const until = (cond) => new Promise((resolve) => frameWaiters.push({ cond, resolve }));
function runWaiters() {
  for (let i = frameWaiters.length - 1; i >= 0; i--) if (frameWaiters[i].cond()) frameWaiters.splice(i, 1)[0].resolve();
}

// -- buttons: A talks and advances text, B advances too (as in FireRed) --
const buttons = { a: false, b: false, aPressed: false, bPressed: false };
const aKeys = new Set(['z', 'enter', ' ', 'e']), bKeys = new Set(['x', 'backspace', 'escape', 'q']);
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.target.closest?.('input, button')) return;
  if (aKeys.has(k)) { if (!buttons.a) buttons.aPressed = true; buttons.a = true; e.preventDefault(); }
  if (bKeys.has(k)) { if (!buttons.b) buttons.bPressed = true; buttons.b = true; }
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (aKeys.has(k)) buttons.a = false;
  if (bKeys.has(k)) buttons.b = false;
});
const aBtn = $('aBtn');
aBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); buttons.aPressed = true; buttons.a = true; aBtn.classList.add('held'); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) aBtn.addEventListener(ev, () => { buttons.a = false; aBtn.classList.remove('held'); });
/** True once per press. */
const takeA = () => { const p = buttons.aPressed || buttons.bPressed; buttons.aPressed = buttons.bPressed = false; return p; };

// -- the text box: two lines, typed out, scrolling and paging like FireRed --
const box = { lines: [], shown: 0, typing: false, speed: 40, open: false };
function formatText(t) {
  return t.replace(/\{(\w+)\}/g, (_, k) => NAMES[k] ?? '');
}
function openBox(style, color) {
  $('textbox').hidden = false;
  $('textbox').dataset.style = style;
  $('textbox').dataset.color = color;
  box.open = true;
}
function closeBox() {
  $('textbox').hidden = true;
  $('tb1').textContent = $('tb2').textContent = '';
  box.open = false;
}
/** Type out one string; resolves after the reader dismisses its last line. */
async function say(raw, { style = 'normal', color = 'neutral', wait = true } = {}) {
  openBox(style, color);
  const pages = formatText(raw).split('\\p');
  for (let pi = 0; pi < pages.length; pi++) {
    const lines = pages[pi].split(/\\[nl]/);
    $('tb1').textContent = $('tb2').textContent = '';
    for (let li = 0; li < lines.length; li++) {
      let el = li === 0 ? $('tb1') : $('tb2');
      if (li >= 2) {
        // Scroll: wait, move line 2 up, type the next line below it.
        $('tbMore').hidden = false;
        await until(takeA);
        $('tbMore').hidden = true;
        $('tb1').textContent = $('tb2').textContent;
        $('tb2').textContent = '';
        el = $('tb2');
      }
      const line = lines[li];
      let shown = 0;
      takeA();
      await until(() => {
        const fast = buttons.a || buttons.b;
        shown = Math.min(line.length, shown + (fast ? 3 : 1) * box.speed * frameDt);
        el.textContent = line.slice(0, Math.floor(shown));
        if (takeA()) shown = line.length; // a press finishes the line
        el.textContent = line.slice(0, Math.floor(shown));
        return shown >= line.length;
      });
    }
    if (wait || pi < pages.length - 1) {
      $('tbMore').hidden = false;
      await until(takeA);
      $('tbMore').hidden = true;
    }
  }
}
/** YES / NO in the corner; resolves 1 or 0. */
async function yesNo() {
  let choice = 1;
  const render = () => { $('yes').classList.toggle('on', choice === 1); $('no').classList.toggle('on', choice === 0); };
  $('yesno').hidden = false; render();
  takeA();
  await until(() => {
    if (held.has('up')) choice = 1;
    if (held.has('down')) choice = 0;
    render();
    if (buttons.bPressed) { buttons.bPressed = false; choice = 0; return true; }
    if (buttons.aPressed) { buttons.aPressed = false; return true; }
    return false;
  });
  $('yesno').hidden = true;
  return choice;
}

// -- the script player --
const DIR_OF = { 1: 'down', 2: 'up', 3: 'left', 4: 'right' };
const DIR_NUM = { down: 1, up: 2, left: 3, right: 4 };
const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
const resolve = (a) => { let v = a; for (let i = 0; i < 4 && SCRIPTS.consts[v] != null; i++) v = SCRIPTS.consts[v]; return v; };
function value(a) {
  const v = resolve(a);
  if (/^VAR_/.test(v)) return v === 'VAR_FACING' ? DIR_NUM[player.facing] : story.vars[v] ?? 0;
  const n = Number(v);

        case 'copyvar': story.vars[resolve(args[0])] = value(args[1]); break;
        case 'addvar': story.vars[resolve(args[0])] = value(args[0]) + value(args[1]); break;
        case 'subvar': story.vars[resolve(args[0])] = value(args[0]) - value(args[1]); break;

  /** Press A (or B) once, then let some game time pass. */
  async press(button = 'a', seconds = 0.5) {
    buttons[button + 'Pressed'] = true;
    await this.tick(seconds);
    return this.text();
  },
  async tick(seconds) { await runFrames(seconds); },
  /** What the text box shows right now ('' when closed). */
  text() {
    return $('textbox').hidden ? '' : `[${$('textbox').dataset.style}/${$('textbox').dataset.color}] ${$('tb1').textContent} / ${$('tb2').textContent}`;
  },
  where() {
    const c = locate(player.x, player.y);
    return `${c ? c.m.D.name : '?'} ${c ? `${c.x},${c.y}` : ''} facing ${player.facing}`;
  },
};
</script>
<script>
// If the 3D library can't load, say so instead of showing a blank sky.
addEventListener('error', (e) => {
  if (document.getElementById('error')) return;
  const box = document.createElement('div');
  box.id = 'error';
  box.textContent = `The 3D view couldn't start: ${e.message || 'a script failed to load'}. Reload the page to try again.`;
  document.body.append(box);
}, true);
</script>
